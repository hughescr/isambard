[install]
exact = true

[test]
root = "./tests"
preload = ["./tests/setup.ts"]
coverage = true
coverageThreshold = { line = 0.95, function = 0.95, statement = 0.95 }
coverageReporter = ["text"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
    # Exclude all test files and test helpers - these don't need coverage as they are the tests themselves
    "tests/**",
    "src/index.ts",
    # Exclude plugins directories - these are external/user-managed
    "plugins/**",
    # Exclude scratch and running directories - these are runtime/worktree areas
    "scratch/**",
    "running/**"
]
onlyFailures = true
timeout = 5
randomize = true
