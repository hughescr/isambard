id: no-optional-chain-non-null-assertion
language: typescript
severity: error
message: |
  $X?.$Y! is contradictory — the optional chain (?.) admits that the left-hand side
  may be undefined/null, but the non-null assertion (!) asserts that the result is
  never nullish. Remove one: either use $X.$Y (if you know it's never null) or
  $X?.$Y (and handle the possibly-undefined result).
rule:
  pattern: $X?.$Y!
